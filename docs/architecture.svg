<text x="517" y="800" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Search, authenticated cart and readback</text>
<rect x="940" y="698" width="460" height="115" rx="16" fill="#ffffff" stroke="#dce3db" stroke-width="2"/>
<text x="962" y="737" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#182c25">Future retailers</text>
<text x="962" y="771" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Register another provider and fixtures</text>
<text x="962" y="800" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Reuse the planner and review interface</text>
