<text x="62" y="589" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Pinned local k-ruoka-mcp process</text>
<text x="62" y="618" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Reviewed schemas and capabilities</text>
<text x="62" y="647" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Verified account and store context</text>
