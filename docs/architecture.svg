<text x="517" y="589" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Pinned local s-kaupat-mcp release</text>
<text x="517" y="618" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Separate project; browser choice in S0</text>
<text x="517" y="647" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Verified account and store context</text>
<rect x="940" y="516" width="460" height="145" rx="16" fill="#ffffff" stroke="#dce3db" stroke-width="2"/>
<text x="962" y="555" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#182c25">Local persistence</text>
<text x="962" y="589" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">SQLite with migrations and backup</text>
<text x="962" y="618" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Recipes, plans and purchase history</text>
<text x="962" y="647" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Cart snapshots and operation journal</text>
