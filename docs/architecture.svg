<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
<title id="title">Korikone local desktop architecture</title>
<desc id="desc">A graphical desktop app calls a local application core. ChatGPT provides AI drafts. Two local MCP adapters reach K-Ruoka and the separate S-kaupat MCP project. Only the human completes checkout.</desc>
<rect width="1440" height="1020" fill="#f6f7f3"/>
<text x="40" y="63" font-family="Segoe UI, sans-serif" font-size="38" font-weight="700" fill="#182c25">Korikone</text>
<text x="40" y="100" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#52615a">Local desktop app • ChatGPT assistance • Two retailers • Human checkout</text>
<text x="40" y="140" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#52615a">LOCAL APP AND EXTERNAL SERVICES</text>
<rect x="40" y="158" width="850" height="115" rx="16" fill="#ffffff" stroke="#dce3db" stroke-width="2"/>
<text x="62" y="197" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#182c25">React interface in Electron</text>
<text x="62" y="231" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Planner, recipes, store selection and basket review • Finnish / English</text>
<text x="62" y="260" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Narrow validated IPC; no credentials or generic tool execution</text>
<rect x="940" y="158" width="460" height="115" rx="16" fill="#eaf3ed" stroke="#dce3db" stroke-width="2"/>
<text x="962" y="197" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#182c25">ChatGPT / OpenAI</text>
<text x="962" y="231" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Browser sign-in and plan permission</text>
<text x="962" y="260" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Eligible AI requests use the user’s plan</text>
<rect x="40" y="320" width="850" height="140" rx="16" fill="#ffffff" stroke="#dce3db" stroke-width="2"/>
<text x="62" y="359" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#182c25">Local application and domain services</text>
<text x="62" y="393" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Validate AI drafts; calculate ingredients, packs, prices and cart diffs</text>
<text x="62" y="422" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Bind approval to the basket, retailer account and current cart</text>
<text x="62" y="451" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Journal writes; reconcile failures; verify the result</text>
<rect x="940" y="320" width="460" height="140" rx="16" fill="#ffffff" stroke="#dce3db" stroke-width="2"/>
<text x="962" y="359" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#182c25">Local AI runtime</text>
<text x="962" y="393" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Protected OAuth tokens and profiles</text>
<text x="962" y="422" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">Model discovery and completed output</text>
<text x="962" y="451" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">No retailer credentials or cart tools</text>
