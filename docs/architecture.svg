<text x="62" y="909" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#182c25">Human checkout</text>
<text x="62" y="943" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52615a">After verified transfer, open the same authenticated cart in a human-controlled store window. The user orders and pays.</text>
